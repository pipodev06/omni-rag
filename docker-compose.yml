# =====================================================================
# RAG multi-cliente — todo el sistema con un solo comando:
#     cp .env.example .env   (y edítalo)
#     docker compose up -d --build
# Luego abre http://localhost:8000
# Ver docs/instalacion.md para más detalles.
# =====================================================================
name: rag

services:
  # Base de datos: PostgreSQL 17 con la extensión pgvector.
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432" # solo accesible desde esta máquina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_owner -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Embeddings locales (gratis, privados, sin límite de uso) con Hugging Face TEI.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    # Lotes de 4096 tokens: misma calidad, ~2,3 GB de RAM en vez de ~3,2 GB.
    command: ["--model-id", "${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}", "--max-batch-tokens", "4096", "--max-client-batch-size", "32"]
    volumes:
      - hf-cache:/data # el modelo se descarga una sola vez
    ports:
      - "127.0.0.1:${EMBEDDINGS_PORT:-18080}:80"

  # Re-ranker local (cross-encoder multilingüe): reordena los resultados de la
  # búsqueda leyendo pregunta y fragmento juntos. ~1,6 GB de RAM, ~0,6 s por pregunta en CPU.
  # Para desactivarlo: RERANKER_URL= (vacío) y RERANKER_REPLICAS=0 en .env.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    command: ["--model-id", "${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}", "--max-batch-tokens", "4096", "--max-client-batch-size", "32"]
    volumes:
      - hf-cache:/data
    deploy:
      replicas: ${RERANKER_REPLICAS:-1}

  # Conversión de documentos (PDF, Office, HTML, imágenes con OCR…) a Markdown.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.37.0
    restart: unless-stopped
    environment:
      # Cada conversión simultánea puede usar ~3 GB con PDFs grandes.
      # 1 = cabe en 8 GB; súbelo solo si tienes RAM de sobra (ver docs/requisitos.md).
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: ${DOCLING_WORKERS:-1}
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: ${DOCLING_TIMEOUT_SECONDS:-900}
      DOCLING_SERVE_ENABLE_UI: "false"
    # Procesa archivos de usuarios (no confiables): red interna, sin salida a internet
    # ni acceso a la base de datos. Solo el worker puede hablar con él.
    networks: [ingest]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5001/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Antivirus ClamAV (opcional): la API analiza cada archivo subido y rechaza los infectados.
  # Se activa con COMPOSE_PROFILES=antivirus y CLAMAV_HOST=clamav en .env. Usa ~2 GB de RAM y descarga
  # las firmas (~300 MB) al arrancar; por eso necesita salida a internet (no va en la red «ingest»).
  clamav:
    image: clamav/clamav:1.4
    profiles: ["antivirus"]
    restart: unless-stopped
    environment:
      # clamd rechaza por defecto los archivos de más de 25 MB: se sube al máximo de subida + margen.
      CLAMD_CONF_StreamMaxLength: ${CLAMAV_MAX_SIZE:-100M}
      CLAMD_CONF_MaxFileSize: ${CLAMAV_MAX_SIZE:-100M}
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # API HTTP (Hono + TypeScript). Aplica migraciones al arrancar.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgres://rag_owner:${POSTGRES_PASSWORD}@db:5432/rag
      APP_DATABASE_URL: postgres://rag_app:${APP_DB_PASSWORD}@db:5432/rag
      EMBEDDINGS_URL: http://embeddings:80
      DOCLING_URL: http://docling:5001
      RERANKER_URL: ${RERANKER_URL-http://reranker:80}
      STORAGE_DIR: /data/uploads
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      REQUIRE_SUPERADMIN_2FA: ${REQUIRE_SUPERADMIN_2FA:-auto}
    volumes:
      - uploads:/data/uploads
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy

  # Worker: procesa los documentos subidos en segundo plano.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [default, ingest]
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started
      docling:
        condition: service_started

  # Interfaz web (React) servida por nginx, que además redirige /api a la API.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # En producción con Caddy, pon WEB_BIND=127.0.0.1 para que solo se entre por HTTPS.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8000}:80"
    depends_on:
      - api

  # Copias de seguridad automáticas en ./backups (base de datos + archivos).
  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-false}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
      - ./backups:/backups
      # Carpeta externa (disco, NAS, carpeta sincronizada). Solo se usa con BACKUP_OFFSITE=true.
      - ${BACKUP_OFFSITE_DIR:-./backups-offsite}:/offsite
    depends_on:
      db:
        condition: service_healthy

  # HTTPS automático (Let's Encrypt). Solo con COMPOSE_PROFILES=https y DOMAIN definido.
  caddy:
    image: caddy:2.11-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  # Servidor de correo de PRUEBAS: captura los emails sin enviarlos.
  # Bandeja en http://localhost:8025. Solo con COMPOSE_PROFILES=correo-pruebas.
  mailpit:
    image: axllent/mailpit:v1.31
    profiles: ["correo-pruebas"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

networks:
  # Red sin salida a internet donde vive Docling.
  ingest:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  pgdata:
  clamav-db:
  hf-cache:
  uploads:
