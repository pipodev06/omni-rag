name: rag

x-dns: &dns
  - ${DNS_PRIMARY:-1.1.1.1}
  - ${DNS_SECONDARY:-8.8.8.8}

services:
  db:
    image: ghcr.io/pipodev06/omni-rag-ops:${OMNI_RAG_VERSION:-latest}
    build: &ops-build
      context: .
      dockerfile: deploy/ops.Dockerfile
    restart: unless-stopped
    entrypoint: ["sh", "-c", "sh /init-secrets.sh && export POSTGRES_PASSWORD=\"$${POSTGRES_PASSWORD:-$$(cat /secrets/postgres_password)}\" && exec docker-entrypoint.sh postgres"]
    environment:
      POSTGRES_USER: rag_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: rag
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/secretos:/secrets
      - ./data/uploads:/prepare/uploads
      - ./data/copias-config:/prepare/copias-config
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_owner -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    dns: *dns
    command: ["--model-id", "${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}", "--max-batch-tokens", "4096", "--max-client-batch-size", "32"]
    cpus: ${EMBEDDINGS_CPUS:-0}
    cpu_shares: ${EMBEDDINGS_CPU_SHARES:-1024}
    mem_limit: ${EMBEDDINGS_MEM_LIMIT:-0}
    volumes:
      - ./data/modelos:/data
    ports:
      - "127.0.0.1:${EMBEDDINGS_PORT:-18080}:80"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    dns: *dns
    command: ["--model-id", "${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}", "--max-batch-tokens", "4096", "--max-client-batch-size", "32"]
    cpus: ${RERANKER_CPUS:-0}
    cpu_shares: ${RERANKER_CPU_SHARES:-1024}
    mem_limit: ${RERANKER_MEM_LIMIT:-0}
    volumes:
      - ./data/modelos:/data
    deploy:
      replicas: ${RERANKER_REPLICAS:-1}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.37.0
    restart: unless-stopped
    dns: *dns
    environment:
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: ${DOCLING_WORKERS:-1}
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: ${DOCLING_TIMEOUT_SECONDS:-900}
      DOCLING_SERVE_ENABLE_UI: "false"
    cpus: ${DOCLING_CPUS:-0}
    cpu_shares: ${DOCLING_CPU_SHARES:-1024}
    mem_limit: ${DOCLING_MEM_LIMIT:-0}
    oom_score_adj: ${DOCLING_OOM_SCORE_ADJ:-0}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [ingest]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5001/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  clamav:
    image: clamav/clamav:1.4
    profiles: ["antivirus"]
    restart: unless-stopped
    dns: *dns
    environment:
      CLAMD_CONF_StreamMaxLength: ${CLAMAV_MAX_SIZE:-100M}
      CLAMD_CONF_MaxFileSize: ${CLAMAV_MAX_SIZE:-100M}
    volumes:
      - ./data/clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  api:
    image: ghcr.io/pipodev06/omni-rag-api:${OMNI_RAG_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    dns: *dns
    env_file: &env-file
      - path: .env
        required: false
    environment: &backend-env
      DATABASE_URL: ""
      APP_DATABASE_URL: ""
      SECRETS_DIR: /secrets
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      EMBEDDINGS_URL: http://embeddings:80
      DOCLING_URL: http://docling:5001
      RERANKER_URL: ${RERANKER_URL-http://reranker:80}
      STORAGE_DIR: /data/uploads
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      REQUIRE_SUPERADMIN_2FA: ${REQUIRE_SUPERADMIN_2FA:-auto}
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL-http://docker-filter:2375}
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/secretos:/secrets:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/pipodev06/omni-rag-api:${OMNI_RAG_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    dns: *dns
    command: ["node", "dist/worker.js"]
    cpu_shares: ${WORKER_CPU_SHARES:-1024}
    env_file: *env-file
    environment: *backend-env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/secretos:/secrets:ro
      - ./backups:/backups:ro
      - ./data/copias-estado:/backup-status:ro
      - ./data/copias-config:/backup-config
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [default, ingest, docker]
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started
      docling:
        condition: service_started

  web:
    image: ghcr.io/pipodev06/omni-rag-web:${OMNI_RAG_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8000}:80"
    environment:
      REAL_IP_FROM: ${REAL_IP_FROM:-}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    depends_on:
      - api

  docker-filter:
    image: ghcr.io/pipodev06/omni-rag-api:${OMNI_RAG_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/dockerFilter.js"]
    environment:
      DOCKER_UPSTREAM_URL: http://docker-proxy:2375
    networks: [docker, docker-socket]
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - docker-proxy

  docker-proxy:
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    user: ${DOCKER_PROXY_USER:-0:0}
    command:
      - "-listenip=0.0.0.0"
      - "-allowfrom=docker-filter"
      - "-allowGET=(/v[0-9.]+)?/(info|containers/json|containers/[0-9a-f]{64}/(stats|json))"
      - "-watchdoginterval=600"
      - "-stoponwatchdog"
      - "-shutdowngracetime=5"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks: [docker-socket]
    mem_limit: 32m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  backup:
    image: ghcr.io/pipodev06/omni-rag-ops:${OMNI_RAG_VERSION:-latest}
    build: *ops-build
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-}
      BACKUP_AT: ${BACKUP_AT:-}
      BACKUP_UPLOADS_TGZ: ${BACKUP_UPLOADS_TGZ:-}
      BACKUP_TZ: ${BACKUP_TZ:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-}
      BACKUP_DESTINATION: ${BACKUP_DESTINATION:-}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
    volumes:
      - ./data/secretos:/secrets:ro
      - ./data/uploads:/uploads:ro
      - ./backups:/backups
      - ${BACKUP_OFFSITE_DIR:-backups-offsite}:/offsite
      - ${BACKUP_TARGETS_DIR:-backups-targets}:/targets
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]

  backup-b2:
    image: ghcr.io/pipodev06/omni-rag-ops:${OMNI_RAG_VERSION:-latest}
    build: *ops-build
    restart: unless-stopped
    dns: *dns
    entrypoint: ["sh", "/b2-sync.sh"]
    depends_on:
      - worker
    environment:
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${B2_KEY_ID:-}
      RCLONE_CONFIG_B2_KEY: ${B2_APPLICATION_KEY:-}
      RCLONE_CONFIG_B2_HARD_DELETE: "true"
      B2_BUCKET: ${B2_BUCKET:-}
      B2_PATH: ${B2_PATH:-}
      B2_INTERVAL_HOURS: ${B2_INTERVAL_HOURS:-}
      B2_AT: ${B2_AT:-}
      B2_SYNC_UPLOADS: ${B2_SYNC_UPLOADS:-}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      BACKUP_TZ: ${BACKUP_TZ:-}
      BACKUP_DESTINATION: ${BACKUP_DESTINATION:-}
      B2_KEEP_DAYS: ${B2_KEEP_DAYS:-}
    volumes:
      - ./data/uploads:/uploads:ro
      - ${BACKUP_OFFSITE_DIR:-backups-offsite}:/offsite:ro
      - ${BACKUP_TARGETS_DIR:-backups-targets}:/targets:ro
      - ./data/copias-config:/backup-config:ro
      - ./data/copias-estado:/status
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]

  caddy:
    image: caddy:2.11-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      - web

  mailpit:
    image: axllent/mailpit:v1.31
    profiles: ["correo-pruebas"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  ingest:
    internal: true
  docker:
    internal: true
  docker-socket:
    internal: true

configs:
  caddyfile:
    content: |
      {$$DOMAIN} {
        encode zstd gzip
        header {
          Strict-Transport-Security "max-age=31536000; includeSubDomains"
          -Server
        }
        reverse_proxy web:80 {
          flush_interval -1
        }
      }

volumes:
  backups-offsite:
  backups-targets:
