# Opcional: conectar la web a la red Docker de un proxy que ya corre en el servidor (Nginx Proxy Manager, Traefik,
# Caddy propio…) para que lo alcance por nombre: rag-web-1:80. Sin esto, un proxy que está solo en su red da 502
# («rag-web-1 could not be resolved»). Cambia «proxy» por el nombre real de esa red (docker network ls).
#
# Dos formas, las dos valen:
#   - Override: cp docker-compose.override.example.yml docker-compose.override.yml (al actualizar, reemplazas solo el
#     docker-compose.yml y esto se mantiene).
#   - Un solo archivo: pega estas líneas en el propio docker-compose.yml (al actualizar, vuelve a pegarlas).
#
# El docker-compose.yml oficial no trae esta red porque haría fallar el arranque a quien no tenga una red «proxy».
services:
  web:
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
