name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag_owner
          POSTGRES_PASSWORD: ci-owner-pass
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag_owner -d rag"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://rag_owner:ci-owner-pass@localhost:5432/rag
      APP_DATABASE_URL: postgres://rag_app:ci-app-pass@localhost:5432/rag
      APP_DB_PASSWORD: ci-app-pass
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (falla con vulnerabilidades altas o críticas)
        run: pnpm audit --audit-level=high
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas (unitarias + aislamiento entre organizaciones con Row Level Security)
        run: pnpm test
      - name: Compilar
        run: pnpm build

  # Construye las imágenes en cada push. Desde main (o una etiqueta v1.2.3) y con las pruebas en verde, las publica en
  # GitHub (ghcr.io/pipodev06/omni-rag-api, omni-rag-web y omni-rag-ops, la de init/backup/backup-b2), que es de donde
  # las descarga «docker compose pull».
  #   main   → :latest y :sha-<commit>
  #   v1.2.3 → :1.2.3 y :1.2 (para fijar una versión con OMNI_RAG_VERSION)
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: ops
            dockerfile: deploy/ops.Dockerfile
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Entrar en GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/omni-rag-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Construir (y publicar desde main o una etiqueta) omni-rag-${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml válido (también con el override de ejemplo)
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.override.example.yml config --quiet
