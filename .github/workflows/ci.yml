name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag_owner
          POSTGRES_PASSWORD: ci-owner-pass
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag_owner -d rag"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://rag_owner:ci-owner-pass@localhost:5432/rag
      APP_DATABASE_URL: postgres://rag_app:ci-app-pass@localhost:5432/rag
      APP_DB_PASSWORD: ci-app-pass
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (falla con vulnerabilidades altas o críticas)
        run: pnpm audit --audit-level=high
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas (unitarias + aislamiento entre organizaciones con Row Level Security)
        run: pnpm test
      - name: Compilar
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagen de la API
        run: docker build -f apps/api/Dockerfile -t rag-api .
      - name: Imagen de la web
        run: docker build -f apps/web/Dockerfile -t rag-web .
      - name: docker-compose.yml válido
        run: cp .env.example .env && docker compose config --quiet
