# Proxies de confianza (REAL_IP_FROM; los genera /docker-entrypoint.d/30-real-ip.sh al arrancar). Se mira la dirección
# que conecta de verdad ($realip_remote_addr), no la que resulta de X-Forwarded-For.
geo $realip_remote_addr $from_trusted_proxy {
  default 0;
  include /etc/nginx/trusted-proxies.geo;
}

# X-Forwarded-Proto (http/https) solo se respeta si lo escribe un proxy de confianza; si no, el esquema real.
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
  default  $scheme;
  "1:http"  http;
  "1:https" https;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Las peticiones JSON no necesitan más; la subida de documentos tiene su propio tope (location = /api/documents).
  client_max_body_size 1m;
  server_tokens off;

  # IP real del cliente: se confía en X-Forwarded-For solo cuando lo escribe un proxy de confianza (REAL_IP_FROM; por
  # defecto, las redes privadas: Caddy, Nginx Proxy Manager, el túnel de Cloudflare…). nginx recorre la cadena desde el
  # final saltando esos proxies y se queda con la primera IP que no lo es; lo que invente el cliente al principio no cuenta.
  include /etc/nginx/real-ip.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  include /etc/nginx/security-headers.conf;

  # Compresión: el JavaScript, el CSS y el JSON de la API bajan a un tercio. El streaming del chat (text/event-stream)
  # no está en la lista, así que sigue llegando palabra a palabra.
  gzip_static on; # sirve los .gz precomprimidos al construir la imagen (sin gastar CPU)
  gzip on; # el resto (JSON de la API) se comprime al vuelo
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css text/plain text/markdown application/javascript text/javascript application/json image/svg+xml;

  # API: se redirige al contenedor "api". Con una variable, nginx vuelve a resolver el
  # nombre (DNS interno de Docker) y no se queda con la IP vieja si la API se recrea.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:3001;

  location /api/ {
    proxy_pass $api_upstream;
    # La API ya envía algunas cabeceras de seguridad; se quitan para que no queden duplicadas con las de nginx.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # La API solo lee X-Real-IP (ya resuelta arriba). Se reescriben las dos para que no pase nada del cliente.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Necesario para que las respuestas del chat lleguen en streaming.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;

    # Subida de documentos: varios archivos por petición (la API aplica MAX_UPLOAD_MB por archivo).
    location = /api/documents {
      client_max_body_size 500m;
      proxy_pass $api_upstream;
    }
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # El worker de PDF.js es un módulo .mjs; nginx no conoce esa extensión y lo
  # serviría como binario, lo que impide al navegador ejecutarlo.
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # Aplicación de una sola página: cualquier otra ruta sirve index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
}
