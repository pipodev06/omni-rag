# Si hay un proxy delante (Caddy con HTTPS), respetar sus cabeceras X-Forwarded-*.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 500m;

  # API: se redirige al contenedor "api".
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Necesario para que las respuestas del chat lleguen en streaming.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # El worker de PDF.js es un módulo .mjs; nginx no conoce esa extensión y lo
  # serviría como binario, lo que impide al navegador ejecutarlo.
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Aplicación de una sola página: cualquier otra ruta sirve index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
